---
# The browser tests: the canvas and chart controls driven with real key
# presses, the offline-asset test run against real vendored D3 and Leaflet, the
# map page and the canvas map cards run with the optional renderer and geocoder
# deliberately absent, and the map card tests run with the renderer installed.
#
# These are a workflow of their own rather than a job in perl-ci.yml.  The Perl
# matrix is about the application under different Perls; this is about the page
# under a browser, and one browser on one machine is the honest check.  The
# jobs set BI_REQUIRE_BROWSER, because a runner without a usable browser should
# not be mistaken for a passing one; they refuse to pass by skipping.
#
# What each job pins - every one of these states is reachable on a developer's
# machine by accident and would otherwise never be exercised by CI:
#
#   keyboard            t/browser-*.t on a stock runner: Perl 5.40, Firefox ESR;
#                       the optional modules are not pinned, and the job records
#                       which ones it found in its log and job summary
#   no-renderer         t/browser-map-page-renderer.t with HTML::OSM verifiably
#                       not loadable - the job fails if it is
#   no-renderer-canvas  the same absence for the canvas map card, in
#                       t/browser-canvas-map-degraded.t
#   renderer            the mirror of those two: t/browser-map-panel.t and
#                       t/browser-seed-canvas.t with HTML::OSM 0.12 installed
#                       and verified - the only run in which the map card's
#                       drawing assertions are exercised rather than skipped
#   no-geocoder         t/browser-map-geocoder.t and t/browser-canvas-map-
#                       geocoder.t with Geo::Coder::Free verifiably not
#                       loadable - the job fails if it is
#   offline-assets      t/browser-offline-assets.t against checksum-verified
#                       D3 7.9.0 and Leaflet 1.9.4 (markercluster 1.5.3) served
#                       from public/static/, with the stand-in made an error.
#                       This is the only job whose chart bars are drawn by the
#                       real D3, so it is the one that asserts they are (the
#                       stand-in reports no version) and that the page around
#                       the generated chart carries <html lang> - on the chart
#                       page and on the canvas chart card, and publishes which
#                       charts it proved to the job summary
#
# The absent-module jobs are separate because such a branch cannot be reached
# on a machine that has the module, and a dependency that pulls one in would
# otherwise leave every job green while the degraded pages went untested.  Each
# names the page or card it is about, so a failure says which one broke.
#
# Every job also publishes a summary of what it proved: the pages each test
# file loaded, the canvas cards on them with their kind, and the claims the test
# made (BI::Test::Browser's proved()).  A green job otherwise says only that its
# files passed, which is not the same as saying which pages were driven -
# t/browser-chart-keys.t and t/browser-canvas-keys.t read alike whether one
# page or five were opened.  The reports are per test file, so the -j2 glob
# keeps them apart, and they are written as the fixture stops, so a failing run
# says how far it got.
name: Browser tests

'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
      # Green with nothing run is not green: if the browser is missing or
      # broken, the tests fail rather than skipping.
      BI_REQUIRE_BROWSER: 1
      AUTHOR_TESTING: 1
      # Where BI::Test::Browser writes what each test file proved; the last
      # step of the job publishes it to the summary.  The workspace rather than
      # runner.temp, which is not a context a job-level env may read: GitHub
      # rejects the whole file with "Unrecognized named-value: 'runner'".
      BI_BROWSER_REPORT_DIR: ${{ github.workspace }}/browser-report
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: '5.40'

      - name: Install cpanm and local::lib
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install DB_File, needed for a lot of CPAN modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libdb-dev libperl-dev

      - name: Install dependencies
        shell: bash
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          cpanm --notest --installdeps --verbose .

      # What this job leaves to the runner.  Recommended modules are optional, by
      # design, so the branches that need one - drawing a map, geocoding a place
      # column - run here only if the machine has it and it is new enough.  The
      # other jobs pin their state; this one reports the state it got, in the log
      # and in the job summary, so a green run can be read for what it covered
      # instead of being assumed to have covered everything.
      - name: Report the optional modules this runner has
        shell: bash
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"

          # The list and the floors come from cpanfile, which
          # t/recommended-versions.t keeps in step with Makefile.PL, so this
          # cannot drift from the metadata it is describing.
          report=$(mktemp)
          # The same probe as one line, which the job summary opens with: this
          # job pins nothing, so the pages it drove were driven on whatever this
          # machine has.
          condition=$(mktemp)
          perl - "$condition" <<'PERL' > "$report"
            use strict;
            use warnings;

            open my $fh, '<', 'cpanfile' or die "cpanfile: $!";
            my @optional;
            while (my $line = <$fh>) {
              push @optional, [ $1, $2 ]
                if $line =~ /^\s*recommends\s+'([\w:]+)'(?:\s*,\s*'([^']*)')?\s*;/;
            }
            close $fh;

            print "| optional module | version needed | on this runner |\n";
            print "| --- | --- | --- |\n";

            my @found;
            for my $entry (@optional) {
              my ($module, $floor) = @$entry;
              $floor = undef if defined $floor && !length $floor;

              # require takes a file when the name is in a variable, not a
              # package name, so the separator is translated by hand.
              my $loaded = eval {
                (my $path = $module) =~ s{::}{/}g;
                require "$path.pm";
                1;
              };
              my $published = $loaded ? $module->VERSION : undef;
              my $found     = defined $published ? $published : 'no version';

              # VERSION(n) is the check the application itself makes, and it
              # compares versions the way Perl does rather than as decimals.
              my $state =
                  !$loaded                             ? 'not installed'
                : !defined $floor                      ? $found
                : eval { $module->VERSION($floor); 1 }  ? $found
                :                                        "$found (too old)";

              printf "| %s | %s | %s |\n",
                $module, (defined $floor ? $floor : 'any'), $state;

              push @found, "$module $state";
            }

            print "\nA module that is absent, or older than the version needed, "
              . "makes the browser tests skip the assertions that need it.\n";

            # The one-line form of the table, for the job summary.
            open my $cf, '>', $ARGV[0] or die "$ARGV[0]: $!";
            print {$cf} join(', ', @found), "\n";
            close $cf or die "$ARGV[0]: $!";
          PERL

          cat "$report"
          printf 'BI_BROWSER_REPORT_CONDITION=%s\n' \
            "optional modules not pinned: $(cat "$condition")" >> "${GITHUB_ENV:-/dev/null}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            { printf '\n'; cat "$report"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$report" "$condition"

      - name: Install Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          # Mozilla's tarball, not the Ubuntu snap the runner ships: a snap has
          # a private /tmp, and would not see the profile the fixture writes
          # there.  ESR because it changes rarely, and these tests are about
          # the page's behaviour rather than the newest engine.
          firefox-version: latest-esr

      - name: Run the keyboard browser tests
        shell: bash
        env:
          BI_FIREFOX: ${{ steps.setup-firefox.outputs.firefox-path }}
          # The runner's AppArmor policy can refuse the user namespaces the
          # content sandbox asks for.  The sandbox is not what these tests are
          # about, and the pages are the app's own.
          MOZ_DISABLE_CONTENT_SANDBOX: '1'
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          "$BI_FIREFOX" --version
          prove -l -v -j2 t/browser-*.t

      # The glob is one line in the log whatever it drove, and a file that
      # proves one page looks the same in the TAP as a file that proves five.
      # The tests reported what they reached, so the run says so - including
      # when a file failed, since the report is written as the fixture stops.
      - uses: ./.github/actions/browser-report
        if: always()

  # HTML::OSM is a recommends, so the page has to survive without it: it reports
  # the renderer and draws nothing rather than failing the request.  That branch
  # is easy to lose - it is not reached on a machine that has the module, and no
  # test can fake the absence once the module is genuinely loaded in the process
  # (Test::Without::Module's @INC hook is bypassed during in-process dispatch).
  # The keyboard job happens to run without it today, but only by accident: if
  # the distribution ever gains HTML::OSM as a requirement, or the runner image
  # ships it, the missing-renderer branch would quietly stop being exercised
  # while every job stayed green.  This job makes the state explicit and refuses
  # to run in any other one.  no-renderer-canvas below pins the same absence for
  # the canvas map card.
  no-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
      BI_REQUIRE_BROWSER: 1
      AUTHOR_TESTING: 1
      # See the keyboard job: runner.temp cannot be read from a job-level env.
      BI_BROWSER_REPORT_DIR: ${{ github.workspace }}/browser-report
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: '5.40'

      - name: Install cpanm and local::lib
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install DB_File, needed for a lot of CPAN modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libdb-dev libperl-dev

      - name: Install dependencies, without the optional renderer
        shell: bash
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          cpanm --notest --installdeps --verbose .

          # --installdeps does not install recommends, so HTML::OSM should not
          # be here; remove it if something pulled it in, then insist it is
          # gone.  A run with the module present would exercise the control
          # branch instead of the one this job exists for, and pass.
          if perl -MHTML::OSM -e1 2>/dev/null; then
            echo "HTML::OSM arrived with the dependencies; removing it"
            cpanm --notest --uninstall HTML::OSM
          fi
          if perl -MHTML::OSM -e1 2>/dev/null; then
            echo "::error::HTML::OSM is installed, so this job cannot test the missing-renderer branch"
            exit 1
          fi
          echo "HTML::OSM is absent, as this job requires"

          # What the summary opens with, measured where the absence is enforced:
          # a green run of this job is a run on a machine with no renderer at
          # all, which is the state the degraded page describes.
          printf 'BI_BROWSER_REPORT_CONDITION=%s\n' \
            'HTML::OSM not installed (verified by this job)' >> "${GITHUB_ENV:-/dev/null}"

      - name: Install Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: latest-esr

      - name: Run the map page browser test with the renderer absent
        shell: bash
        env:
          BI_FIREFOX: ${{ steps.setup-firefox.outputs.firefox-path }}
          MOZ_DISABLE_CONTENT_SANDBOX: '1'
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          "$BI_FIREFOX" --version
          # Without HTML::OSM the usable-renderer control skips itself, so the
          # run is the two degraded states only - the note on the page, nothing
          # drawn, the marker count intact - which is the point of the job.
          prove -l -v t/browser-map-page-renderer.t

      # Which page in which renderer state, and what it was held to.  The job
      # exists to exercise one branch; the summary is where the run says the
      # branch was reached, rather than leaving that to the TAP reader.
      - uses: ./.github/actions/browser-report
        if: always()

  # The same pinned absence for the canvas map card.  t/browser-canvas-map-
  # degraded.t produces the missing and too-old renderer states through the
  # server-side stand-in, so it passes on any machine; what this job adds is the
  # machine itself, where HTML::OSM is really not installed.  That is the state
  # the card's "not installed" note describes, and an application that started
  # to require the module - or to call its constructor unconditionally, which is
  # what broke GET /map in 0.017.0 - would fail here rather than pass on a runner
  # that happens to have it.  Separate from the map page job so a failure names
  # the page it is about, and so neither waits for the other.
  no-renderer-canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
      BI_REQUIRE_BROWSER: 1
      AUTHOR_TESTING: 1
      # See the keyboard job: runner.temp cannot be read from a job-level env.
      BI_BROWSER_REPORT_DIR: ${{ github.workspace }}/browser-report
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: '5.40'

      - name: Install cpanm and local::lib
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install DB_File, needed for a lot of CPAN modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libdb-dev libperl-dev

      - name: Install dependencies, without the optional renderer
        shell: bash
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          cpanm --notest --installdeps --verbose .

          # --installdeps does not install recommends, so HTML::OSM should not
          # be here; remove it if something pulled it in, then insist it is
          # gone.  The canvas test would still pass with the module present -
          # the stand-in answers for it - so nothing but this check would
          # notice, and the run would be of a machine the note does not
          # describe.
          if perl -MHTML::OSM -e1 2>/dev/null; then
            echo "HTML::OSM arrived with the dependencies; removing it"
            cpanm --notest --uninstall HTML::OSM
          fi
          if perl -MHTML::OSM -e1 2>/dev/null; then
            echo "::error::HTML::OSM is installed, so this job cannot test the missing-renderer branch"
            exit 1
          fi
          echo "HTML::OSM is absent, as this job requires"

          # What the summary opens with, measured where the absence is enforced:
          # a green run of this job is a run on a machine with no renderer at
          # all, which is the state the degraded page describes.
          printf 'BI_BROWSER_REPORT_CONDITION=%s\n' \
            'HTML::OSM not installed (verified by this job)' >> "${GITHUB_ENV:-/dev/null}"

      - name: Install Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: latest-esr

      - name: Run the canvas map card test with the renderer absent
        shell: bash
        env:
          BI_FIREFOX: ${{ steps.setup-firefox.outputs.firefox-path }}
          MOZ_DISABLE_CONTENT_SANDBOX: '1'
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          "$BI_FIREFOX" --version
          # Without HTML::OSM the usable-renderer control skips itself, so the
          # run is the missing and too-old cards only - the visible note, no
          # map element, the marker count intact, the table card beside it
          # untouched - which is the point of the job.
          prove -l -v t/browser-canvas-map-degraded.t

      # The cards this run proved, and in which renderer state: the canvas is a
      # second document with its own card ids, so its summary is its own.
      - uses: ./.github/actions/browser-report
        if: always()

  # The mirror of the two jobs above.  A map card only carries its Leaflet
  # element, its own marker script and its redraw when the server has HTML::OSM,
  # so without the module those assertions skip - correctly, and in every job
  # that exists today, because none installs it.  t/browser-map-panel.t and
  # t/browser-seed-canvas.t were failing on the keyboard runner for exactly that
  # reason: they read #map-0 and #map-1 as if a card always has one.  The skip is
  # honest, but a check that never runs is not coverage, so this job is the run
  # where it does: the same files with the renderer really installed.  The
  # version is pinned to the release this distribution asks for (0.017.1 needs
  # HTML::OSM 0.12 or later) instead of taken from the runner, and the job fails
  # if the copy that loads is older or absent - so a green run here means the
  # drawing assertions ran, not that they skipped politely.
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
      # Green with nothing run is not green, as in every job here.
      BI_REQUIRE_BROWSER: 1
      AUTHOR_TESTING: 1
      # See the keyboard job: runner.temp cannot be read from a job-level env.
      BI_BROWSER_REPORT_DIR: ${{ github.workspace }}/browser-report
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: '5.40'

      - name: Install cpanm and local::lib
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install DB_File, needed for a lot of CPAN modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libdb-dev libperl-dev

      - name: Install dependencies, with the optional renderer
        shell: bash
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          cpanm --notest --installdeps --verbose .

          # Pinned rather than whatever CPAN has today: the tests read the
          # markup HTML::OSM generates and the ids it names, so a release that
          # changes them should arrive as a deliberate edit here, not as a red
          # run on a Monday.  --installdeps never installs a recommends, so this
          # is the only step that puts the module in.
          cpanm --notest 'HTML::OSM@0.12'

          # Insist on it, the way the absent-renderer jobs insist on the
          # absence: with the module missing or too old the two tests below skip
          # their drawing assertions, and this job would then be a slower copy of
          # the keyboard one.
          version=$(perl -MHTML::OSM=0.12 -e 'print $HTML::OSM::VERSION' 2>/dev/null) || {
            echo "::error::HTML::OSM 0.12 or later is not usable, so the drawing assertions would skip"
            exit 1
          }
          echo "HTML::OSM $version is installed, as this job requires"

          # What the summary opens with, measured where the module is checked.
          printf 'BI_BROWSER_REPORT_CONDITION=%s\n' \
            "HTML::OSM $version installed (verified by this job)" >> "${GITHUB_ENV:-/dev/null}"

      - name: Install Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: latest-esr

      - name: Run the map browser tests with the renderer installed
        shell: bash
        env:
          BI_FIREFOX: ${{ steps.setup-firefox.outputs.firefox-path }}
          MOZ_DISABLE_CONTENT_SANDBOX: '1'
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          "$BI_FIREFOX" --version
          # t/browser-map-panel.t goes from the table's Map panel to the map
          # page and then a canvas it saves and edits; t/browser-seed-canvas.t
          # makes a canvas from every chart route.  With a renderer these are
          # the runs where the map card has its Leaflet element, its own marker
          # script and its redraw - the five assertions that are skipped where
          # it does not.
          prove -l -v t/browser-map-panel.t t/browser-seed-canvas.t \
            2>&1 | tee "$RUNNER_TEMP/renderer-run.txt"
          # A file that skipped instead of running (no AUTHOR_TESTING, no
          # browser) and a drawing assertion that skipped both mean this run
          # proved less than its name says, so neither may pass.  The one skip
          # these files make with a renderer is the Leaflet stand-in block, which
          # the page skips when the real library did load - that is why this
          # looks for the drawing message rather than for the word skip.
          if grep -q 'skipped:' "$RUNNER_TEMP/renderer-run.txt"; then
            echo "::error::a test file skipped instead of running, so this job proved nothing"
            exit 1
          fi
          if grep -q 'HTML::OSM 0.12 or later is needed' "$RUNNER_TEMP/renderer-run.txt"; then
            echo "::error::the drawing assertions skipped, so this job did not exercise what it exists for"
            exit 1
          fi

      # Which pages and cards this run proved, opening with the renderer it
      # had: the same pages mean something different in the other state.
      - uses: ./.github/actions/browser-report
        if: always()

  # The other optional module the map needs, pinned the same way.  Both tests
  # produce the missing and too-old geocoder states through a stand-in in the
  # server child, so they pass on any machine; what this job adds is the machine
  # itself, where Geo::Coder::Free is really not installed.  That is the state
  # both "not installed" notes describe, and an application that started to
  # require the module - rather than probing for it per request, as
  # _load_geocoder does - would fail here instead of passing on a runner that
  # happens to have it.  The map page and the canvas card are the same module on
  # two fronts: GET /map is one template's page, a card is the same _map_data
  # rendered into a canvas, and pinning only one would leave the other's branch
  # to luck.  The keyboard job installs no recommends either, but only by
  # accident: a dependency could pull this one in, and then the branch would
  # quietly stop being exercised while every job stayed green.
  no-geocoder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
      BI_REQUIRE_BROWSER: 1
      AUTHOR_TESTING: 1
      # See the keyboard job: runner.temp cannot be read from a job-level env.
      BI_BROWSER_REPORT_DIR: ${{ github.workspace }}/browser-report
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: '5.40'

      - name: Install cpanm and local::lib
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install DB_File, needed for a lot of CPAN modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libdb-dev libperl-dev

      - name: Install dependencies, without the optional geocoder
        shell: bash
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          cpanm --notest --installdeps --verbose .

          # Geo::Coder::Free is a recommends, so --installdeps should not
          # install it; remove it if something pulled it in, then insist it is
          # gone.  The test would still pass with the module present - its
          # stand-in answers for it - so nothing but this check would notice,
          # and the run would be of a machine the note does not describe.
          if perl -MGeo::Coder::Free -e1 2>/dev/null; then
            echo "Geo::Coder::Free arrived with the dependencies; removing it"
            cpanm --notest --uninstall Geo::Coder::Free
          fi
          if perl -MGeo::Coder::Free -e1 2>/dev/null; then
            echo "::error::Geo::Coder::Free is installed, so this job cannot test the missing-geocoder branch"
            exit 1
          fi
          echo "Geo::Coder::Free is absent, as this job requires"

          # As in the renderer jobs: the summary says which machine it was, so a
          # green run cannot be read as having covered a geocoder it never had.
          printf 'BI_BROWSER_REPORT_CONDITION=%s\n' \
            'Geo::Coder::Free not installed (verified by this job)' >> "${GITHUB_ENV:-/dev/null}"

      - name: Install Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: latest-esr

      - name: Run the map page and canvas map card tests with the geocoder absent
        shell: bash
        env:
          BI_FIREFOX: ${{ steps.setup-firefox.outputs.firefox-path }}
          MOZ_DISABLE_CONTENT_SANDBOX: '1'
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          "$BI_FIREFOX" --version
          # The page and the canvas are checked in both states.  GET /map must
          # carry the visible note, draw nothing and still say how many markers
          # it would have plotted; the canvas place card must carry the note
          # while the coordinate card beside it keeps its markers and its own
          # notes.  The absence is what the notes describe; the stand-in
          # supplies the reason they quote.
          prove -l -v t/browser-map-geocoder.t t/browser-canvas-map-geocoder.t

      # Both fronts of the same module, as separate sections: the page the
      # route renders and the card the canvas renders, for the missing and the
      # too-old geocoder.
      - uses: ./.github/actions/browser-report
        if: always()

  # t/browser-offline-assets.t can run with its stand-ins in a bare checkout.
  # That keeps the file runnable, but it does not prove the real D3 and Leaflet
  # builds work with the chart and map cards.  This job downloads pinned
  # releases to the same public/static paths a deployment uses and makes the
  # stand-in fallback an error, so a missing file cannot pass as a vendored run.
  # Being the run where the real D3 draws the charts, it is also the only one
  # that can assert the bars are that library's and that the page carrying the
  # generated chart HTML still declares <html lang> - for the /bar page and for
  # the canvas chart card, whose svg is named for its visual index instead of
  # for the chart kind.  The test skips those six assertions in a stand-in run
  # rather than passing them vacuously, and writes what it proved to the file
  # below, which the last step publishes to the job summary.
  offline-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
      BI_REQUIRE_BROWSER: 1
      AUTHOR_TESTING: 1
      # The test writes this, the publish step below reads it; one expression so
      # the two cannot disagree about where it is.
      BI_OFFLINE_ASSET_REPORT: ${{ github.workspace }}/vendored-charts.md
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: '5.40'

      - name: Install cpanm and local::lib
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install DB_File, needed for a lot of CPAN modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libdb-dev libperl-dev

      - name: Install dependencies
        shell: bash
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          cpanm --notest --installdeps --verbose .

      - name: Install Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Vendor D3 and Leaflet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/static/d3 public/static/leaflet

          fetch() {
            local url="$1" path="$2" digest="$3"
            curl --fail --silent --show-error --location "$url" --output "$path"
            printf '%s  %s\n' "$digest" "$path" | sha256sum --check --status
          }

          fetch 'https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js' \
            'public/static/d3/d3.min.js' \
            'f2094bbf6141b359722c4fe454eb6c4b0f0e42cc10cc7af921fc158fceb86539'
          fetch 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js' \
            'public/static/leaflet/leaflet.js' \
            'db49d009c841f5ca34a888c96511ae936fd9f5533e90d8b2c4d57596f4e5641a'
          fetch 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css' \
            'public/static/leaflet/leaflet.css' \
            'a7837102824184820dfa198d1ebcd109ff6d0ff9a2672a074b9a1b4d147d04c6'
          fetch 'https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js' \
            'public/static/leaflet/leaflet.markercluster.js' \
            '1e4e1d22972a3926f48598e0caf14e3fe7049835d428a344fed4f9e3665b3508'
          fetch 'https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css' \
            'public/static/leaflet/MarkerCluster.css' \
            '614dea0a98ff3f4ead74f04918f6b1d1b9ba435c25b5fc23b21a394d1e3e4d87'
          fetch 'https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css' \
            'public/static/leaflet/MarkerCluster.Default.css' \
            '61258232d98d64dc2a7b1e02130d67421bc5b9bda5994eef70228ff97570c170'

      - name: Run the offline asset browser test
        shell: bash
        env:
          BI_FIREFOX: ${{ steps.setup-firefox.outputs.firefox-path }}
          BI_REQUIRE_VENDORED_ASSETS: 1
          MOZ_DISABLE_CONTENT_SANDBOX: '1'
        run: |
          eval "$(perl -I ~/perl5/lib/perl5 -Mlocal::lib)"
          "$BI_FIREFOX" --version
          prove -l -v t/browser-offline-assets.t

      # A green run of that file says the file passed, not what it established:
      # with the stand-ins the drawn-bar assertions pass too, and nothing in the
      # TAP output says which library drew them.  The test wrote its answer down,
      # so the run states it whether or not the test passed - and says plainly
      # when no answer was written, rather than leaving the summary silent.
      - name: Publish which charts the vendored files drew
        if: always()
        shell: bash
        run: |
          set -eu
          summary="$RUNNER_TEMP/offline-asset-charts.md"
          if [ -f "$BI_OFFLINE_ASSET_REPORT" ]; then
            cp "$BI_OFFLINE_ASSET_REPORT" "$summary"
          else
            echo "::warning::the offline-asset test wrote no chart report, so this run cannot say which charts it proved"
            printf '## Offline-asset charts\n\n- no report: the test did not reach its vendored assertions\n' > "$summary"
          fi
          cat "$summary"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            { printf '\n'; cat "$summary"; } >> "$GITHUB_STEP_SUMMARY"
          fi
